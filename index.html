<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A modern, responsive Todo List application"
    />
    <title>Todo List - Stay Organized</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>Todo List</h1>
        <p class="subtitle">Stay organized and productive</p>
      </header>

      <main class="main-content">

        <form class="task-form" id="taskForm" aria-label="Add new task">
          <div class="input-group">
            <input
              type="text"
              id="taskInput"
              class="task-input"
              placeholder="What needs to be done?"
              aria-label="Task input"
              autocomplete="off"
            />
            <button type="submit" class="btn btn-primary" aria-label="Add task">
              Add
            </button>
          </div>
        </form>

        <div class="filters" role="group" aria-label="Filter tasks">
          <button
            type="button"
            class="filter-btn active"
            data-filter="all"
            aria-pressed="true"
          >
            All
          </button>
          <button
            type="button"
            class="filter-btn"
            data-filter="active"
            aria-pressed="false"
          >
            Active
          </button>
          <button
            type="button"
            class="filter-btn"
            data-filter="completed"
            aria-pressed="false"
          >
            Completed
          </button>
        </div>


        <div class="task-stats" id="taskStats" role="status" aria-live="polite">
          <span id="taskCount">0 tasks left</span>
        </div>

        <ul class="task-list" id="taskList"></ul>

        <div class="actions" id="actionsContainer" style="display: none">
          <button
            type="button"
            class="btn btn-secondary"
            id="clearCompleted"
            aria-label="Clear completed tasks"
          >
            Clear Completed
          </button>
        </div>
      </main>

      <footer class="footer">
        <p>&copy; 2025 Todo List App</p>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
